name: Deploy Mozhi to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install documentation dependencies
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Install browser test library
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Check language and build the combined site
        run: |
          python -m unittest discover -s tests -q
          python tools/build_site.py
      - name: Check navigation and documentation search
        env:
          MOZHI_TEST_BROWSER: /usr/bin/google-chrome
        run: npm run test:site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
