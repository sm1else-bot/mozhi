site_name: Mozhi Documentation
site_url: https://projects.jessenth.com/mozhi/learn/
site_description: Professional documentation for the Tanglish-based Mozhi programming language.
repo_url: https://github.com/sm1else-bot/mozhi
repo_name: sm1else-bot/mozhi
copyright: Mozhi · An experimental language with Tamil-inspired syntax
exclude_docs: |
  /overrides/
theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  font:
    text: DM Sans
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/studio.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Welcome: index.md
  - Getting Started:
      - Installation: install.md
      - First Program: cli/programs.md
  - Command Line:
      - Command Reference: cli/index.md
      - Interactive REPL: cli/repl.md
      - Troubleshooting: troubleshooting.md
  - Basics:
      - Variables: basics/variables.md
      - Input & Output: basics/io.md
      - Operators: basics/operators.md
  - Control Flow:
      - Conditionals: control-flow/conditionals.md
      - Loops: control-flow/loops.md
  - Advanced Features:
      - Functions: advanced/functions.md
      - Arrays (Varisai): advanced/arrays.md
      - Object-Oriented (OOP): advanced/oop.md
  - Examples:
      - CLI Programs: examples/cli-programs.md
      - Interactive Calculator: examples/calculator.md
  - Runtime Reference:
      - Running Mozhi: runtime.md
      - Standard Library: standard-library.md
      - Errors & Validation: errors.md
  - Maintainers:
      - Distribution: distribution.md
      - First PyPI Release: pypi-release.md
