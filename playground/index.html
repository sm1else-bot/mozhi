<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozhi Playground</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    


    <style>
        [hidden] { display: none !important; }
        #status { padding: 8px 20px; }
        #time-limit { width: 5em; margin: 0 10px; }
        #code-editor { flex: 1; min-height: 15em; background: #282a36; color: #f8f8f2; }
        header { gap: 12px; flex-wrap: wrap; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #252526;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #007acc;
        }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1177bb;
        }
        
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        .output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }

        .pane-header {
            background-color: #2d2d30;
            padding: 5px 15px;
            font-size: 0.9rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }

        .CodeMirror {
            flex: 1;
            height: auto;
            font-size: 16px;
        }

        #output {
            flex: 1;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            white-space: pre-wrap;
            overflow-y: auto;
            color: #d4d4d4;
            background-color: #1e1e1e;
        }
        
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mozhi Playground</h1>
        <div>
            <label for="time-limit">Execution limit (seconds)</label>
            <input id="time-limit" type="number" min="0.1" max="3600" step="0.1" value="10">
            <button id="run-btn" disabled>Run Mozhi</button>
            <button id="stop-btn" disabled>Stop</button>
            <button id="retry-btn" hidden>Retry engine</button>
        </div>
    </header>

    <div id="status" role="status">Loading engine…</div>
    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-header">Code</div>
            <textarea id="code-editor"></textarea>
        </div>
        <div class="output-pane">
            <div class="pane-header">Output</div>
            <div id="output"></div>
            <form id="input-container" hidden style=" padding: 15px; background-color: #252526; border-top: 1px solid #333;">
                <input type="text" id="mozhi-input" placeholder="Mozhi-la type pannu..." style="background-color: #1e1e1e; color: #d4d4d4; border: 1px solid #333; padding: 10px; font-size: 1rem; width: 70%; border-radius: 4px; margin-right: 10px;">
                <button type="submit">Enter</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
