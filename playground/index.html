        // Set default Mozhi code
        editor.setValue(`name = "Nanba" vechukko

        const outputDiv = document.getElementById('output');
        const runBtn = document.getElementById('run-btn');

        let pyodideInstance = null;

        // 2. The Python source code for Mozhi
        // We embed the Python code here so it works entirely client-side without fetching external files.
        const mozhiPythonCode = `
import sys
try:
    import js
except ImportError:
    js = None
import re
import operator
import io

# We redirect stdout so we can capture print statements and return them to JS
class OutputCatcher(io.StringIO):
    def __init__(self):
        super().__init__()
    def write(self, s):
        super().write(s)
        try:
            if js:
                js.appendMozhiOutput(s)
        except Exception:
            pass
        
catcher = OutputCatcher()
sys.stdout = catcher

TT_NUMBER   = 'NUMBER'
TT_STRING   = 'STRING'
TT_NAME     = 'NAME'
TT_KEYWORD  = 'KEYWORD'
TT_OP       = 'OP'
TT_LPAREN   = 'LPAREN'
TT_RPAREN   = 'RPAREN'
TT_LBRACKET = 'LBRACKET'
TT_RBRACKET = 'RBRACKET'
TT_COMMA    = 'COMMA'
TT_COLON    = 'COLON'
TT_NEWLINE  = 'NEWLINE'
TT_INDENT   = 'INDENT'
TT_DEDENT   = 'DEDENT'
TT_EOF      = 'EOF'
TT_DOT      = 'DOT'

KEYWORDS = {
    'sollu', 'vechukko', 'varaikum', 'na', 'illana',
    'mudivu', 'seiy', 'thirumbu', 'nillu', 'thodaru',
    'mattrum', 'illaiyal', 'illa', 'true', 'false',
    'kooda', 'ullapodu', 'veliyapodu', 'vagai', 'porul', 'podhum'
}

class Token:
    def __init__(self, type_, value, line=0):
        self.type = type_
        self.value = value
        self.line = line

def tokenize(source: str):
    tokens = []
    lines = source.splitlines(keepends=True)
    indent_stack = [0]

    for lineno, line in enumerate(lines, 1):
        stripped = line.strip()
        if not stripped or stripped.startswith('#'):
            continue

        indent = len(line) - len(line.lstrip())
        current_indent = indent_stack[-1]

        if indent > current_indent:
            indent_stack.append(indent)
            tokens.append(Token(TT_INDENT, indent, lineno))
        elif indent < current_indent:
            while indent_stack[-1] > indent:
                indent_stack.pop()
                tokens.append(Token(TT_DEDENT, indent, lineno))

        content = stripped
        col = 0
        while col < len(content):
            if content[col] == ' ':
                col += 1
                continue

            if content[col] == '#':
                break

            if content[col] in ('"', "'"):
                q = content[col]
                end = col + 1
                while end < len(content):
                    if content[end] == q and content[end-1] != '\\\\':
                        break
                    end += 1
                
                if end >= len(content):
                     raise SyntaxError(f"[Mozhi] Line {lineno}: String a close panniya da? Missing closing quote.")
                
                val = content[col+1:end].replace('\\\\n', '\\n').replace('\\\\t', '\\t').replace('\\\\"', '"').replace("\\\\'", "'")
                tokens.append(Token(TT_STRING, val, lineno))
                col = end + 1
                continue

            m = re.match(r'\\d+(\\.\\d+)?', content[col:])
            if m:
                val = m.group()
                tokens.append(Token(TT_NUMBER, float(val) if '.' in val else int(val), lineno))
                col += len(val)
                continue

            for op in ('==', '!=', '<=', '>=', '<', '>', '+', '-', '*', '/', '%', '=', '**'):
                if content[col:].startswith(op):
                    tokens.append(Token(TT_OP, op, lineno))
                    col += len(op)
                    break
            else:
                c = content[col]
                if c == '(':
                    tokens.append(Token(TT_LPAREN, '(', lineno))
                elif c == ')':
                    tokens.append(Token(TT_RPAREN, ')', lineno))
                elif c == '[':
                    tokens.append(Token(TT_LBRACKET, '[', lineno))
                elif c == ']':
                    tokens.append(Token(TT_RBRACKET, ']', lineno))
                elif c == ',':
                    tokens.append(Token(TT_COMMA, ',', lineno))
                elif c == ':':
                    tokens.append(Token(TT_COLON, ':', lineno))
                elif c == '.':
                    tokens.append(Token(TT_DOT, '.', lineno))
                elif re.match(r'[a-zA-Z_]', c):
                    m2 = re.match(r'[a-zA-Z_][a-zA-Z0-9_]*', content[col:])
                    word = m2.group()
                    tt = TT_KEYWORD if word in KEYWORDS else TT_NAME
                    tokens.append(Token(tt, word, lineno))
                    col += len(word)
                    continue
                else:
                    raise SyntaxError(f"[Mozhi] Line {lineno}: Theriyatha character '{c}'")
                col += 1

        tokens.append(Token(TT_NEWLINE, '\\n', lineno))

    while len(indent_stack) > 1:
        indent_stack.pop()
        tokens.append(Token(TT_DEDENT, 0, 0))

    tokens.append(Token(TT_EOF, None, 0))
    return tokens

class Assign:
    def __init__(self, name, expr): self.name = name; self.expr = expr
class Print:
    def __init__(self, expr): self.expr = expr
class While:
    def __init__(self, cond, body): self.cond = cond; self.body = body
class If:
    def __init__(self, cond, then_body, else_body): self.cond = cond; self.then_body = then_body; self.else_body = else_body
class FuncDef:
    def __init__(self, name, params, body): self.name = name; self.params = params; self.body = body
class ClassDef:
    def __init__(self, name, methods): self.name = name; self.methods = methods
class Return:
    def __init__(self, expr): self.expr = expr
class Break: pass
class Continue: pass
class Exit: pass
class ArrayPush:
    def __init__(self, array_expr, value_expr): self.array_expr = array_expr; self.value_expr = value_expr
class ArrayPop:
    def __init__(self, array_expr): self.array_expr = array_expr
class BinOp:
    def __init__(self, left, op, right): self.left = left; self.op = op; self.right = right
class UnaryOp:
    def __init__(self, op, operand): self.op = op; self.operand = operand
class Num:
    def __init__(self, value): self.value = value
class Str:
    def __init__(self, value): self.value = value
class Bool:
    def __init__(self, value): self.value = value
class Var:
    def __init__(self, name): self.name = name
class ArrayLiteral:
    def __init__(self, elements): self.elements = elements
class ArrayIndex:
    def __init__(self, array_expr, index_expr): self.array_expr = array_expr; self.index_expr = index_expr
class ObjectInstantiation:
    def __init__(self, class_name): self.class_name = class_name
class MethodCall:
    def __init__(self, obj_expr, method_name, args): self.obj_expr = obj_expr; self.method_name = method_name; self.args = args
class FuncCall:
    def __init__(self, name, args): self.name = name; self.args = args

class PropertyAssign:
    def __init__(self, obj_name, prop_name, expr):
        self.obj_name = obj_name
        self.prop_name = prop_name
        self.expr = expr

class Parser:
    def __init__(self, tokens):
        self.tokens = tokens
        self.pos = 0

    def peek(self): return self.tokens[self.pos]
    def peek2(self):
        if self.pos + 1 < len(self.tokens): return self.tokens[self.pos + 1]
        return Token(TT_EOF, None)

    def consume(self, type_=None, value=None):
        tok = self.tokens[self.pos]
        if type_ and tok.type != type_: raise SyntaxError(f"[Mozhi] Line {tok.line}: Expected {type_}, got {tok.type}")
        if value and tok.value != value: raise SyntaxError(f"[Mozhi] Line {tok.line}: Expected '{value}', got '{tok.value}'")
        self.pos += 1
        return tok

    def skip_newlines(self):
        while self.peek().type == TT_NEWLINE: self.pos += 1

    def parse(self):
        stmts = []
        self.skip_newlines()
        while self.peek().type != TT_EOF:
            stmts.append(self.parse_stmt())
            self.skip_newlines()
        return stmts

    def parse_block(self):
        self.consume(TT_INDENT)
        self.skip_newlines()
        stmts = []
        while self.peek().type not in (TT_DEDENT, TT_EOF):
            stmts.append(self.parse_stmt())
            self.skip_newlines()
        self.consume(TT_DEDENT)
        return stmts

    def parse_stmt(self):
        tok = self.peek()
        if tok.type == TT_KEYWORD and tok.value == 'seiy': return self.parse_func_def()
        if tok.type == TT_KEYWORD and tok.value == 'vagai': return self.parse_class_def()
        if tok.type == TT_KEYWORD and tok.value == 'nillu':
            self.consume(); self.consume(TT_NEWLINE); return Break()
        if tok.type == TT_KEYWORD and tok.value == 'thodaru':
            self.consume(); self.consume(TT_NEWLINE); return Continue()
        if tok.type == TT_KEYWORD and tok.value == 'podhum':
            self.consume(); self.consume(TT_NEWLINE); return Exit()
        if (tok.type == TT_NAME and 
            self.peek2().type == TT_DOT and 
            self.pos + 3 < len(self.tokens) and 
            self.tokens[self.pos + 2].type == TT_NAME and 
            self.tokens[self.pos + 3].type == TT_OP and 
            self.tokens[self.pos + 3].value == '='):
            obj_name = self.consume(TT_NAME).value
            self.consume(TT_DOT)
            prop_name = self.consume(TT_NAME).value
            self.consume(TT_OP, '=')
            expr = self.parse_expr()
            self.consume(TT_KEYWORD, 'vechukko')
            self.consume(TT_NEWLINE)
            return PropertyAssign(obj_name, prop_name, expr)

        if tok.type == TT_NAME and self.peek2().type == TT_OP and self.peek2().value == '=':
            return self.parse_assign()

        expr = self.parse_expr()
        nxt = self.peek()

        if nxt.type == TT_KEYWORD and nxt.value == 'sollu':
            self.consume(); self.consume(TT_NEWLINE); return Print(expr)
        elif nxt.type == TT_KEYWORD and nxt.value == 'thirumbu':
            self.consume(); self.consume(TT_NEWLINE); return Return(expr)
        elif nxt.type == TT_KEYWORD and nxt.value == 'varaikum':
            self.consume(); self.consume(TT_COLON); self.consume(TT_NEWLINE)
            body = self.parse_block()
            self.consume(TT_KEYWORD, 'mudivu'); self.consume(TT_NEWLINE)
            return While(expr, body)
        elif nxt.type == TT_KEYWORD and nxt.value == 'na':
            self.consume(); self.consume(TT_COLON); self.consume(TT_NEWLINE)
            then_body = self.parse_block()
            else_body = []
            if self.peek().type == TT_KEYWORD and self.peek().value == 'illana':
                self.consume(); self.consume(TT_COLON); self.consume(TT_NEWLINE)
                else_body = self.parse_block()
            self.consume(TT_KEYWORD, 'mudivu'); self.consume(TT_NEWLINE)
            return If(expr, then_body, else_body)
        elif nxt.type == TT_KEYWORD and nxt.value == 'ullapodu':
            self.consume()
            target_array = self.parse_expr() 
            self.consume(TT_NEWLINE)
            return ArrayPush(target_array, expr)
        elif nxt.type == TT_KEYWORD and nxt.value == 'veliyapodu':
             self.consume(); self.consume(TT_NEWLINE); return ArrayPop(expr)
        elif nxt.type == TT_NEWLINE:
            self.consume(TT_NEWLINE); return expr

        raise SyntaxError(f"[Mozhi] Line {nxt.line}: Enna pannara? '{nxt.value}' theriyala")

    def parse_assign(self):
        name = self.consume(TT_NAME).value
        self.consume(TT_OP, '=')
        if self.peek().type == TT_NAME and self.peek2().type == TT_KEYWORD and self.peek2().value == 'porul':
            class_name = self.consume(TT_NAME).value
            self.consume(TT_KEYWORD, 'porul')
            expr = ObjectInstantiation(class_name)
        else:
            expr = self.parse_expr()
        self.consume(TT_KEYWORD, 'vechukko')
        self.consume(TT_NEWLINE)
        return Assign(name, expr)

    def parse_func_def(self):
        self.consume(TT_KEYWORD, 'seiy')
        name = self.consume(TT_NAME).value
        self.consume(TT_LPAREN)
        params = []
        if self.peek().type == TT_NAME:
            params.append(self.consume(TT_NAME).value)
            while self.peek().type == TT_COMMA:
                self.consume(TT_COMMA)
                params.append(self.consume(TT_NAME).value)
        self.consume(TT_RPAREN); self.consume(TT_COLON); self.consume(TT_NEWLINE)
        body = self.parse_block()
        self.consume(TT_KEYWORD, 'mudivu'); self.consume(TT_NEWLINE)
        return FuncDef(name, params, body)

    def parse_class_def(self):
        self.consume(TT_KEYWORD, 'vagai')
        name = self.consume(TT_NAME).value
        self.consume(TT_COLON); self.consume(TT_NEWLINE); self.consume(TT_INDENT)
        self.skip_newlines()
        methods = []
        while self.peek().type != TT_DEDENT and self.peek().type != TT_EOF:
             if self.peek().type == TT_KEYWORD and self.peek().value == 'seiy':
                 methods.append(self.parse_func_def())
                 self.skip_newlines()
             else:
                 raise SyntaxError(f"[Mozhi] Line {self.peek().line}: Vagai (class) kulla function matum than irukanum.")
        self.consume(TT_DEDENT); self.consume(TT_KEYWORD, 'mudivu'); self.consume(TT_NEWLINE)
        return ClassDef(name, methods)

    def parse_expr(self): return self.parse_or()
    def parse_or(self):
        left = self.parse_and()
        while self.peek().type == TT_KEYWORD and self.peek().value == 'illaiyal':
            self.consume(); right = self.parse_and()
            left = BinOp(left, 'illaiyal', right)
        return left
    def parse_and(self):
        left = self.parse_not()
        while self.peek().type == TT_KEYWORD and self.peek().value == 'mattrum':
            self.consume(); right = self.parse_not()
            left = BinOp(left, 'mattrum', right)
        return left
    def parse_not(self):
        if self.peek().type == TT_KEYWORD and self.peek().value == 'illa':
            self.consume(); return UnaryOp('illa', self.parse_not())
        return self.parse_compare()
    def parse_compare(self):
        left = self.parse_add()
        while self.peek().type == TT_OP and self.peek().value in ('==', '!=', '<', '>', '<=', '>='):
            op = self.consume().value; right = self.parse_add()
            left = BinOp(left, op, right)
        return left
    def parse_add(self):
        left = self.parse_mul()
        while (self.peek().type == TT_OP and self.peek().value in ('+', '-')) or (self.peek().type == TT_KEYWORD and self.peek().value == 'kooda'):
            op = self.consume().value; right = self.parse_mul()
            left = BinOp(left, op, right)
        return left
    def parse_mul(self):
        left = self.parse_pow()
        while self.peek().type == TT_OP and self.peek().value in ('*', '/', '%'):
            op = self.consume().value; right = self.parse_pow()
            left = BinOp(left, op, right)
        return left
    def parse_pow(self):
        left = self.parse_unary()
        while self.peek().type == TT_OP and self.peek().value == '**':
            op = self.consume().value; right = self.parse_unary()
            left = BinOp(left, op, right)
        return left
    def parse_unary(self):
        if self.peek().type == TT_OP and self.peek().value == '-':
            self.consume(); return UnaryOp('-', self.parse_unary())
        return self.parse_primary()
    def parse_primary(self):
        tok = self.peek()

        if tok.type == TT_NUMBER:
            self.consume(); return Num(tok.value)
        if tok.type == TT_STRING:
            self.consume(); return Str(tok.value)
        if tok.type == TT_KEYWORD and tok.value == 'true':
            self.consume(); return Bool(True)
        if tok.type == TT_KEYWORD and tok.value == 'false':
            self.consume(); return Bool(False)
        if tok.type == TT_LBRACKET:
            self.consume(TT_LBRACKET)
            elements = []
            if self.peek().type != TT_RBRACKET:
                elements.append(self.parse_expr())
                while self.peek().type == TT_COMMA:
                    self.consume(TT_COMMA); elements.append(self.parse_expr())
            self.consume(TT_RBRACKET)
            return ArrayLiteral(elements)
        if tok.type == TT_LPAREN:
            self.consume(TT_LPAREN); expr = self.parse_expr(); self.consume(TT_RPAREN); return expr
        
        if tok.type == TT_NAME:
            name = self.consume(TT_NAME).value
            
            # Check if it's a function call
            if self.peek().type == TT_LPAREN:
                self.consume(TT_LPAREN)
                args = []
                if self.peek().type != TT_RPAREN:
                    args.append(self.parse_expr())
                    while self.peek().type == TT_COMMA:
                        self.consume(TT_COMMA); args.append(self.parse_expr())
                self.consume(TT_RPAREN)
                return FuncCall(name, args)
            
            node = Var(name)
            
            # Chainable properties: Array indexing or Method Calls
            while True:
                if self.peek().type == TT_LBRACKET:
                    self.consume(TT_LBRACKET); index_expr = self.parse_expr(); self.consume(TT_RBRACKET)
                    node = ArrayIndex(node, index_expr)
                elif self.peek().type == TT_DOT:
                    self.consume(TT_DOT)
                    method_name = self.consume(TT_NAME).value
                    # HERE IS THE FIX: Allow dot call to lead into LPAREN for method calls
                    if self.peek().type == TT_LPAREN:
                        self.consume(TT_LPAREN)
                        args = []
                        if self.peek().type != TT_RPAREN:
                            args.append(self.parse_expr())
                            while self.peek().type == TT_COMMA:
                                self.consume(TT_COMMA); args.append(self.parse_expr())
                        self.consume(TT_RPAREN)
                        node = MethodCall(node, method_name, args)
                    else:
                        # If no parens, it's just a property access
                        node = MethodCall(node, method_name, [])
                else: break
            return node
        raise SyntaxError(f"[Mozhi] Line {tok.line}: Unexpected '{tok.value}' — enna ithu?")

class Environment:
    def __init__(self, parent=None): self.vars = {}; self.parent = parent
    def get(self, name):
        if name in self.vars: return self.vars[name]
        if self.parent: return self.parent.get(name)
        raise NameError(f"[Mozhi] Variable '{name}' illa da! Add it first using 'vechukko'")
    def set(self, name, value):
        curr = self
        while curr:
            if name in curr.vars:
                curr.vars[name] = value
                return
            curr = curr.parent
        self.vars[name] = value

class MozhiFunction:
    def __init__(self, name, params, body, closure): self.name = name; self.params = params; self.body = body; self.closure = closure
class MozhiClass:
    def __init__(self, name, methods): self.name = name; self.methods = methods
class MozhiObject:
    def __init__(self, mozhi_class): self.mozhi_class = mozhi_class; self.properties = {}
class ReturnSignal(Exception):
    def __init__(self, value): self.value = value
class BreakSignal(Exception): pass
class ContinueSignal(Exception): pass

CMP = {'==': operator.eq, '!=': operator.ne, '<': operator.lt, '>': operator.gt, '<=': operator.le, '>=': operator.ge}
BUILTINS = {
    'ketukko':  lambda args: (print(str(args[0]), end='') if args else None, js.getMozhiInput(str(args[0]) if args else '') if js else input(''))[1],
    'neelam':   lambda args: len(args[0]),
    'enn':      lambda args: int(args[0]),
    'padam':    lambda args: float(args[0]),
    'vaari':    lambda args: str(args[0]),
}

class Interpreter:
    async def exec_block(self, stmts, env):
        for stmt in stmts: await self.exec(stmt, env)

    async def exec(self, node, env):
        if isinstance(node, Assign): env.set(node.name, await self.eval(node.expr, env))
        elif isinstance(node, Print): print(self.mozhi_repr(await self.eval(node.expr, env)))
        elif isinstance(node, While):
            while self.truthy(await self.eval(node.cond, env)):
                try: await self.exec_block(node.body, Environment(env))
                except BreakSignal: break
                except ContinueSignal: continue
        elif isinstance(node, If):
            if self.truthy(await self.eval(node.cond, env)): await self.exec_block(node.then_body, Environment(env))
            elif node.else_body: await self.exec_block(node.else_body, Environment(env))
        elif isinstance(node, FuncDef): env.set(node.name, MozhiFunction(node.name, node.params, node.body, env))
        elif isinstance(node, ClassDef):
            methods = {m.name: MozhiFunction(m.name, m.params, m.body, env) for m in node.methods}
            env.set(node.name, MozhiClass(node.name, methods))
        elif isinstance(node, Return): raise ReturnSignal(await self.eval(node.expr, env))
        elif isinstance(node, Break): raise BreakSignal()
        elif isinstance(node, Continue): raise ContinueSignal()
        elif isinstance(node, Exit): print("[Mozhi] Podhum, I am out.")
        elif isinstance(node, ArrayPush):
            target = await self.eval(node.array_expr, env); val = await self.eval(node.value_expr, env)
            if not isinstance(target, list): raise TypeError("[Mozhi] Ithu varisai (list) illa da!")
            target.append(val)
        elif isinstance(node, ArrayPop):
            target = await self.eval(node.array_expr, env)
            if not isinstance(target, list) or len(target) == 0: raise TypeError("[Mozhi] Ithu varisai illa, illana empty da!")
            target.pop()
        elif isinstance(node, PropertyAssign):
            obj = env.get(node.obj_name)
            if not isinstance(obj, MozhiObject):
                raise TypeError(f"[Mozhi] '{node.obj_name}' is not an object instance!")
            val = await self.eval(node.expr, env)
            obj.properties[node.prop_name] = val
        elif isinstance(node, FuncCall) or isinstance(node, MethodCall): await self.eval(node, env)

    async def eval(self, node, env):
        if isinstance(node, Num) or isinstance(node, Str) or isinstance(node, Bool): return node.value
        if isinstance(node, Var): return env.get(node.name)
        if isinstance(node, ArrayLiteral):
            elements = []
            for e in node.elements:
                elements.append(await self.eval(e, env))
            return elements
        if isinstance(node, ObjectInstantiation):
             cls = env.get(node.class_name)
             if not isinstance(cls, MozhiClass): raise TypeError(f"[Mozhi] '{node.class_name}' vagai (class) illa da!")
             return MozhiObject(cls)
        if isinstance(node, ArrayIndex):
             arr = await self.eval(node.array_expr, env); idx = await self.eval(node.index_expr, env)
             return arr[idx]
        if isinstance(node, BinOp):
            l = await self.eval(node.left, env); r = await self.eval(node.right, env)
            if node.op in ('+', 'kooda'): return str(l) + str(r) if isinstance(l, str) or isinstance(r, str) else l + r
            if node.op in CMP: return CMP[node.op](l, r)
            if node.op == '-': return l - r
            if node.op == '*': return l * r
            if node.op == '/': return l / r
            if node.op == '%': return l % r
            if node.op == '**': return l ** r
            if node.op == 'mattrum': return self.truthy(l) and self.truthy(r)
            if node.op == 'illaiyal': return self.truthy(l) or self.truthy(r)
        if isinstance(node, UnaryOp):
            v = await self.eval(node.operand, env)
            if node.op == '-': return -v
            if node.op == 'illa': return not self.truthy(v)
        if isinstance(node, FuncCall):
            if node.name in BUILTINS:
                res = BUILTINS[node.name]([await self.eval(a, env) for a in node.args])
                if hasattr(res, 'then') or hasattr(res, '__await__'):
                    res = await res
                return res
            fn = env.get(node.name)
            call_env = Environment(fn.closure)
            for p, a in zip(fn.params, node.args): call_env.vars[p] = await self.eval(a, env)
            try: await self.exec_block(fn.body, call_env)
            except ReturnSignal as r: return r.value
        if isinstance(node, MethodCall):
            obj = await self.eval(node.obj_expr, env)
            if node.method_name not in obj.mozhi_class.methods:
                if node.method_name in obj.properties:
                    return obj.properties[node.method_name]
                raise AttributeError(f"[Mozhi] Object has no property or method '{node.method_name}'")
            method_def = obj.mozhi_class.methods[node.method_name]
            call_env = Environment(method_def.closure)
            call_env.vars[method_def.params[0]] = obj
            for p, a in zip(method_def.params[1:], node.args): call_env.vars[p] = await self.eval(a, env)
            try: await self.exec_block(method_def.body, call_env)
            except ReturnSignal as r: return r.value

    def truthy(self, v): return v not in (None, False, 0, 0.0, '', [])
    def mozhi_repr(self, v):
        if v is True: return 'true'
        if v is False: return 'false'
        if v is None: return 'onnum illa'
        if isinstance(v, list): return '[' + ', '.join(self.mozhi_repr(x) for x in v) + ']'
        if isinstance(v, float) and v.is_integer(): return str(int(v))
        return str(v)

async def execute_mozhi(source):
    catcher.truncate(0)
    catcher.seek(0)
    try:
        tokens = tokenize(source)
        parser = Parser(tokens)
        ast = parser.parse()
        interp = Interpreter()
        await interp.exec_block(ast, Environment())
    except Exception as e:
        print(f"Error: {e}")
    return catcher.getvalue()

        // Global output append function for real-time printing

        async function getMozhiInput(prompt) {
            return new Promise((resolve) => {
                const container = document.getElementById('input-container');
                const inputField = document.getElementById('mozhi-input');
                if (prompt) {
                    inputField.placeholder = prompt;
                } else {
                    inputField.placeholder = "Mozhi-la type pannu...";
                }
                container.style.display = 'block'; // Show the input box
                inputField.focus();

                const handleKeyPress = (e) => {
                    if (e.key === 'Enter') {
                        const val = inputField.value;
                        cleanup();
                        resolve(val);
                    }
                };

                const handleButtonClick = () => {
                    const val = inputField.value;
                    cleanup();
                    resolve(val);
                };

                function cleanup() {
                    inputField.removeEventListener('keydown', handleKeyPress);
                    inputField.value = '';
                    container.style.display = 'none'; // Hide it again
                }

                inputField.addEventListener('keydown', handleKeyPress);
                window.submitInput = handleButtonClick;
            });
        }

        async function main() {
            pyodideInstance = await loadPyodide();
